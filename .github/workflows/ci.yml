name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Squirrel
        run: sudo apt-get update && sudo apt-get install -y squirrel3
      - name: Run self-check
        run: |
          # The Debian/Ubuntu squirrel3 package's binary name varies by release.
          SQ=$(command -v sq || command -v sq3 || command -v squirrel3 || true)
          test -n "$SQ" || { echo "no Squirrel interpreter found on PATH"; exit 1; }
          echo "using $SQ"
          "$SQ" test.nut
